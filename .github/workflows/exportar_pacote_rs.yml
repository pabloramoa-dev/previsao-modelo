name: Exportar pacote independente RS
on:
  workflow_dispatch:
  push:
    branches: [canal/previsao-rs]
    paths:
      - '.github/workflows/exportar_pacote_rs.yml'
permissions:
  contents: read
jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canal/previsao-rs
      - name: Gerar arquivo ZIP sem histórico, tokens ou secrets
        run: |
          mkdir -p exportacao
          git archive --format=zip --output=exportacao/previsao-rs-pronto-para-github.zip HEAD
          unzip -l exportacao/previsao-rs-pronto-para-github.zip | tail -n 2
      - uses: actions/upload-artifact@v4
        with:
          name: previsao-rs-pacote-independente
          path: exportacao/previsao-rs-pronto-para-github.zip
          if-no-files-found: error
          retention-days: 7
