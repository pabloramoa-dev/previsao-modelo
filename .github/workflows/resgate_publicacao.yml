name: Resgate de publicação

# Confere se o turno saiu (media_id na fila), dispara só o turno pendente dentro
# da janela segura (America/Sao_Paulo), acompanha a execução e termina VERMELHO
# se a Meta não confirmar. Mesma chave geral dos Reels: sem
# AUTOMATION_ENABLED=true (como no próprio modelo), não faz nada.
on:
  workflow_dispatch:
  # Disparo externo (cron-job.org): POST /dispatches {"event_type":"resgate"}.
  repository_dispatch:
    types: [resgate]
  schedule:
    - cron: '40 12 * * *'  # 09:40 America/Sao_Paulo
    - cron: '40 13 * * *'  # 10:40 America/Sao_Paulo
    - cron: '10 21 * * *'  # 18:10 America/Sao_Paulo
    - cron: '10 22 * * *'  # 19:10 America/Sao_Paulo

permissions:
  contents: read
  actions: write

jobs:
  resgatar:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    concurrency:
      group: resgate-publicacao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Escolher turno pendente, disparar e confirmar media_id
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python3 -m scripts.resgate_publicacao
