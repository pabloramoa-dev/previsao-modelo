name: Criar repositório exclusivo Previsão RS
on:
  push:
    branches: [canal/previsao-rs]
    paths:
      - '.github/workflows/criar_repositorio_previsao_rs.yml'
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RS_REPO_TOKEN: ${{ secrets.REPO_ADMIN_PAT || secrets.GH_PAT || secrets.GH_PAT_SECRETS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canal/previsao-rs
          persist-credentials: false
      - name: Criar e importar repositório RS de modo seguro
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RS_REPO_TOKEN" ]; then
            echo "::error::Nenhum token administrativo configurado. Necessária criação inicial pelo GitHub."
            exit 1
          fi
          usuario=$(curl -fsSL -H "Authorization: Bearer $RS_REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user" | jq -r '.login // empty')
          if [ "$usuario" != "pabloramoa-dev" ]; then
            echo "::error::O token não pertence a pabloramoa-dev. Operação cancelada."
            exit 1
          fi
          api="https://api.github.com/repos/pabloramoa-dev/previsao-rs"
          existing=$(curl -sSL -o /tmp/rs-existing.json -w '%{http_code}' \
            -H "Authorization: Bearer $RS_REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" "$api")
          if [ "$existing" = "200" ]; then
            echo "::notice::Repositório já existe; não substituir nem sobrescrever arquivos."
            exit 0
          fi
          if [ "$existing" != "404" ]; then
            echo "::error::Não foi possível verificar o repositório com a credencial conectada (HTTP $existing)."
            exit 1
          fi
          code=$(curl -sSL -o /tmp/rs-create.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $RS_REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/repos" \
            -d '{"name":"previsao-rs","description":"Previsão do tempo e alertas do Rio Grande do Sul — @previsaors","private":true,"auto_init":false,"has_issues":true}')
          if [ "$code" != "201" ]; then
            erro=$(jq -r '.message // "Sem mensagem de erro"' /tmp/rs-create.json)
            echo "::error::Criação não autorizada pelo token existente (HTTP $code): $erro"
            exit 1
          fi
          echo "Repositório privado criado; preparando cópia autônoma sem histórico do modelo."
          mkdir -p /tmp/rs-fonte
          git archive HEAD | tar -x -C /tmp/rs-fonte
          rm -f /tmp/rs-fonte/.github/workflows/criar_repositorio_previsao_rs.yml
          sed -i 's/canal\/previsao-rs/main/g' \
            /tmp/rs-fonte/.github/workflows/piloto_previsaors_dupla.yml \
            /tmp/rs-fonte/.github/workflows/exportar_pacote_rs.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/rs-fonte/README.md')
          t=p.read_text(encoding='utf-8')
          marco='## Ativação do novo repositório'
          if marco in t:
              t=t[:t.index(marco)]+'''## Canal independente
          Este repositório é exclusivo do Rio Grande do Sul; possui histórico Git próprio.
          Os workflows são independentes e as publicações no Instagram permanecem desabilitadas
          até configurar credenciais exclusivas para @previsaors.

          ## Ativação das publicações
          1. Validar CI, coleta e render sem publicação.
          2. Definir EXPECTED_IG_USERNAME=previsaors e os secrets exclusivos IG_USER_ID,
             IG_ACCESS_TOKEN e GH_PAT_SECRETS.
          3. Apenas depois de validar publicação manual, ativar AUTOMATION_ENABLED=true.
          '''
          p.write_text(t, encoding='utf-8')
          PY
          cd /tmp/rs-fonte
          git init --initial-branch=main -q
          git config user.name "Previsão RS Bootstrap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Iniciar Previsão RS independente — @previsaors, abertura curta"
          cat > /tmp/rs-askpass <<'EOS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token';;
            *Password*) printf '%s\n' "$RS_REPO_TOKEN";;
          esac
          EOS
          chmod 700 /tmp/rs-askpass
          export GIT_ASKPASS=/tmp/rs-askpass
          export GIT_TERMINAL_PROMPT=0
          git remote add origin https://github.com/pabloramoa-dev/previsao-rs.git
          git push --quiet --set-upstream origin main
          echo "### Previsão RS criada" >> "$GITHUB_STEP_SUMMARY"
          echo "Repo: https://github.com/pabloramoa-dev/previsao-rs" >> "$GITHUB_STEP_SUMMARY"
          echo "Visibilidade: privada; main própria; automação de publicação desativada" >> "$GITHUB_STEP_SUMMARY"
