# A rede de canais estaduais: o que scripts/novo_estado.py precisa para gerar o
# repositorio de cada UF. Fica SO no repositorio-modelo.
#
#   curto / artigo  -> como o roteiro chama o lugar ("no Paraná", "em Minas")
#   titulo          -> palavra do titulo de abertura ("PARANÁ ANTES DE SAIR");
#                      ate ~12 letras, senao o titulo nao cabe em duas linhas
#   grupo           -> minuto do alvo (A=:00, B=:30, C=:45), para os canais nao
#                      disputarem os mesmos runners do GitHub Actions
#   cenario         -> desenho do telao (hyperframes/cenarios.py); "litoral" e
#                      "interior" sao genericos, ate o desenho proprio existir
#   regioes         -> as seis linhas do quadro: rotulo, cidade-ancora (coletada
#                      sempre) e reservas (mesma regiao, nivel 2)
#   "no"/"na"       -> cidades que pedem artigo na fala ("no Recife")
#
# Nomes de municipio exatamente como no cadastro do IBGE (municipios.csv).
# Os @ sao sugestoes: a disponibilidade no Instagram precisa ser conferida.

grupos: {A: 0, B: 30, C: 45}

